# Per-service Railway configuration lives in each app directory:
#
#   apps/api/railway.toml      – Fastify API (healthcheck, restart policy)
#   apps/admin/railway.toml    – Admin Next.js console
#   apps/resident/railway.toml – Resident Next.js PWA
#
# In the Railway dashboard, set the "Root Directory" for each service to its
# respective subdirectory so Railway picks up the correct railway.toml and
# nixpacks.json.
#
# PostgreSQL and Redis must be added as plugins in the Railway project.
# See README.md for full deployment instructions.
