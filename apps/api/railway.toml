[build]
# Railway builds this service with the repo root as the build context (the
# service is configured via `Config-as-code: apps/api/railway.toml`, with no
# Root Directory override), so every path below is repo-root relative.
# pnpm comes from railpack's corepack activation — installing it again with
# `npm install -g pnpm` collides with the corepack shims (EEXIST on pnpx).
installCommand = ""
# `turbo run build --filter=@mysociety/api...` also builds the workspace
# packages the api imports (db/types/config); a bare `pnpm --filter` build only
# runs tsc for the api itself and fails on the missing dependency .d.ts files.
buildCommand = "pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=@mysociety/api..."

[deploy]
startCommand = "node apps/api/dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
