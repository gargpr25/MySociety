[build]
# Disable railpack's auto-detected npm install — root directory is apps/api which has no
# pnpm-lock.yaml, so railpack defaults to npm which cannot resolve workspace:* dependencies.
# Our buildCommand handles install from the repo root using pnpm instead.
installCommand = ""
buildCommand = "ROOT=$(git rev-parse --show-toplevel) && cd $ROOT && pnpm install --frozen-lockfile && pnpm --filter @mysociety/api build"

[deploy]
# Migrations run first (uses DATABASE_URL which Railway provides as a superuser URL).
# The API then starts on the PORT Railway injects.
startCommand = "node dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
