[build]
# installCommand="" stops railpack from auto-detecting npm (no pnpm-lock.yaml in this dir).
# buildCommand navigates to repo root with cd ../.. (reliable; no git required),
# then installs pnpm via npm (always available) and runs the workspace build.
installCommand = ""
buildCommand = "npm install -g pnpm@10.33.0 && cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @mysociety/api build"

[deploy]
startCommand = "node dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
