[build]
# installCommand="" stops railpack from auto-detecting npm (no pnpm-lock.yaml in this dir).
# cd ../.. navigates from apps/admin to repo root without needing git.
installCommand = ""
buildCommand = "npm install -g pnpm@10.33.0 && cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @mysociety/admin build && cp -r apps/admin/.next/static apps/admin/.next/standalone/.next/static"

[deploy]
startCommand = "node .next/standalone/server.js"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
