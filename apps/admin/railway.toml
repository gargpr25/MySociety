[build]
# Railway builds this service with the repo root as the build context (the
# service is configured via `Config-as-code: apps/admin/railway.toml`, with no
# Root Directory override), so every path below is repo-root relative.
# pnpm comes from railpack's corepack activation — installing it again with
# `npm install -g pnpm` collides with the corepack shims (EEXIST on pnpx).
# In a pnpm workspace, `output: "standalone"` nests the server under
# .next/standalone/apps/admin/, and static assets must be copied in beside it.
installCommand = ""
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @mysociety/admin build && cp -r apps/admin/.next/static apps/admin/.next/standalone/apps/admin/.next/static"

[deploy]
startCommand = "node apps/admin/.next/standalone/apps/admin/server.js"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
