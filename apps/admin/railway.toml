[build]
# installCommand="" stops railpack from auto-detecting npm (no pnpm-lock.yaml in this dir).
# cd ../.. navigates from apps/admin to repo root without needing git.
# pnpm comes from railpack's corepack activation — installing it again with
# `npm install -g pnpm` collides with the corepack shims (EEXIST on pnpx).
installCommand = ""
buildCommand = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @mysociety/admin build && cp -r apps/admin/.next/static apps/admin/.next/standalone/.next/static"

[deploy]
startCommand = "node .next/standalone/server.js"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
